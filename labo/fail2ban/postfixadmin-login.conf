# =============================================================================
# Fail2ban - filtre PostfixAdmin (LABO + PROD)
# Fichier : /etc/fail2ban/filter.d/postfixadmin-login.conf
#
# PostfixAdmin logue les tentatives de connexion echouees dans son journal
# applicatif. En complement, on surveille le log d'acces Apache du vhost
# postfixadmin : une rafale de POST /login.php = bruteforce du panneau admin.
# =============================================================================
[Definition]
failregex = ^<HOST> - \S+ \[\S+ \S+\] "POST /login\.php HTTP/\S+" 200
ignoreregex =
