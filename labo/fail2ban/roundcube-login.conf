# =============================================================================
# Fail2ban - Roundcube (LABO meteo-test.lan)
# Fichier : /etc/fail2ban/filter.d/roundcube-login.conf
#
# DECISION : on ne réécrit PAS la regex à la main, on utilise le filtre STOCK
# `roundcube-auth.conf` livré avec fail2ban (maintenu par la communauté,
# source : roundcubemail/program/lib/Roundcube/rcube_imap.php#L180).
#
# POURQUOI le filtre maison echouait (constate, 2h de debug) :
#   - la ligne reelle contient un identifiant aleatoire `<9ind6fld>` entre le
#     timestamp et `IMAP Error` ;
#   - fail2ban interprete TOUT `<xxx>` comme un TAG : ecrire `<\S+>` en dur
#     fait ecarter la ligne entiere ("unknown tag") ;
#   - le filtre stock resout ca avec un `prefregex` qui isole le contenu utile
#     dans <F-CONTENT>, puis applique le failregex sur ce contenu seul.
# Verifie : fail2ban-regex sur la vraie ligne => 1 matched, 0 missed.
#
# Aucun resultat "0 matched" ne doit etre accepte sans verification : une
# prison qui ne se déclenche jamais donne une FAUSSE impression de securite.
# =============================================================================

[INCLUDES]
before = roundcube-auth.conf

[Definition]
# Le filtre stock couvre deja les deux formats (errors log et userlogins).
# Rien a ajouter ici : surcharger risquerait de casser ce qui fonctionne.