<VirtualHost *:80>
    ServerName admin.meteo-test.lan
    DocumentRoot /var/www/postfixadmin/public

    <Directory /var/www/postfixadmin/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
