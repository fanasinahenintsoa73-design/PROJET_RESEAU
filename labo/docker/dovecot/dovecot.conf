# =============================================================================
# dovecot.conf du conteneur — derive de labo/dovecot/dovecot.conf.labo.
# Fichier autonome : pas de conf.d, tout est ici et se lit d'un coup.
# =============================================================================

protocols = imap lmtp sieve
listen = *
base_dir = /var/run/dovecot/
state_dir = /var/lib/dovecot
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr

ssl = required
ssl_cert = </etc/dovecot/tls/dovecot.pem
ssl_key  = </etc/dovecot/tls/dovecot.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
disable_plaintext_auth = yes
auth_mechanisms = plain login

mail_location = maildir:/var/vmail/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = /
}

# --- Authentification et boites : MariaDB ------------------------------------
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf
}
userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf
}

# --- Quotas (regle renvoyee par user_query) ----------------------------------
mail_plugins = $mail_plugins quota
protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

# --- Sieve a la remise --------------------------------------------------------
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

plugin {
  sieve = /var/vmail/sieve/%d/%n/dovecot.sieve
  sieve_dir = /var/vmail/sieve/%d/%n
}

# --- Sockets partagees avec Postfix ------------------------------------------
# Mode 0666 : Postfix et Dovecot sont deux conteneurs distincts, donc deux
# tables d'UID. Le socket ne circule que sur le volume Docker interne.
service auth {
  unix_listener /var/run/dovecot/auth-client {
    mode = 0666
  }
}

service lmtp {
  unix_listener /var/run/dovecot/lmtp {
    mode = 0666
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service managesieve {
  process_limit = 64
}
