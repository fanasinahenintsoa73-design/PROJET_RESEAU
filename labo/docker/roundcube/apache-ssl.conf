<VirtualHost *:443>
    ServerName webmail.meteo-test.lan
    DocumentRoot /var/www/roundcube/public_html

    SSLEngine on
    SSLCertificateFile    /etc/apache2/tls/webmail.pem
    SSLCertificateKeyFile /etc/apache2/tls/webmail.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # config/, temp/ et logs/ sont hors du docroot ; double garde.
    <DirectoryMatch "^/var/www/roundcube/(config|temp|logs)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
