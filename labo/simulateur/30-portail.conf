# =============================================================================
# SIMULATEUR DU PORTAIL METEO (LABO UNIQUEMENT - NE PAS DEPLOYER EN PROD)
# -----------------------------------------------------------------------------
# But : reproduire fidelement le reverse-proxy nginx du Portail Meteo, sur la
# VM de labo, afin de VALIDER la chaine de production complete :
#
#   Navigateur --HTTPS--> simulateur (8444) --HTTP--> vhost interne (8080)
#                                     --X-Forwarded-*-->
#                                     -> Apache -> PHP-FPM -> Roundcube
#
# Ce que le vrai Portail envoie (nginx) et que ce simulateur reproduit :
#   Host:              webmail.meteomadagascar.mg
#   X-Forwarded-Host:  webmail.meteomadagascar.mg
#   X-Forwarded-Proto: https
#   X-Forwarded-Port:  443
#   X-Real-IP:         <IP reelle du client>
#   X-Forwarded-For:   <IP reelle du client>  (ajoute par mod_proxy)
#
# Ce simulateur EST le "Portail" du point de vue de Roundcube : REMOTE_ADDR
# vaut 127.0.0.1, il doit donc etre dans $config['proxy_whitelist'].
#
# En production ce fichier N'EXISTE PAS : c'est le Portail qui joue ce role.
# Usage : /etc/apache2/sites-available/30-portail-simulateur.conf
# =============================================================================

Listen 8444

<VirtualHost *:8444>
    ServerName webmail.meteomadagascar.mg

    # --- TLS : ici snakeoil (D1). Le vrai Portail utilise Let's Encrypt. ---
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # --- Les en-tetes que pose le nginx du Portail -------------------------
    RequestHeader set Host              "webmail.meteomadagascar.mg"
    RequestHeader set X-Forwarded-Host  "webmail.meteomadagascar.mg"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    RequestHeader set X-Real-IP         "expr=%{REMOTE_ADDR}"

    # --- Le relais HTTP vers le vhost interne 8080 --------------------------
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog /var/log/apache2/portail-simulateur_error.log
    CustomLog /var/log/apache2/portail-simulateur_access.log combined
</VirtualHost>
