# =============================================================================
# PostfixAdmin - VHOST INTERNE (port 8081, HTTP brut, RESEAU INTERNE SEUL)
# -----------------------------------------------------------------------------
# PostfixAdmin est la console d'administration : creation des comptes, changement
# des mots de passe, quotas. C'est la cible la plus sensible du projet.
#
# REGLE ABSOLUE (decision de conception, section 6.4) :
#   PostfixAdmin n'est JAMAIS accessible depuis Internet. Pas de DNS public,
#   pas de certificat Let's Encrypt, pas d'ouverture du port dans le
#   MikroTik. On y accede depuis le reseau de la Direction Generale.
#
#   Le vhost ecoute en HTTP sur 8081 (le TLS n'a pas lieu d'etre : le trafic
#   reste sur le LAN, et le port n'est de toute facon pas expose).
#   Si le Portail reverse-proxy le webmail, il NE reverse-proxy PAS
#   PostfixAdmin : un agent ne doit pas pouvoir atteindre la console
#   d'administration via l'URL du webmail.
#
# CONTROLE D'ACCES : seules les IP du reseau interne sont acceptees.
#   @@PLAGE_LAN_DGM@@  : reseau de la Direction Generale (a fixer a l'installation)
#   127.0.0.1         : administration en local sur le serveur
#   ::1               : idem en IPv6
#
# ACCES DEPUIS LE SERVEUR : ssh -L 8081:127.0.0.1:8081 <serveur>
# =============================================================================

Listen 8081

<VirtualHost *:8081>
    ServerName @@HOSTNAME_POSTFIXADMIN@@
    DocumentRoot /opt/postfixadmin/public

    # --- PHP-FPM : pool DEDIE, execute sous l'utilisateur Unix "pfa" ------
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.1-fpm-postfixadmin.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /opt/postfixadmin/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- Restriction d'acces : RESEAU INTERNE UNIQUEMENT -------------------
    <Location />
        Require ip 127.0.0.1
        Require ip @@PLAGE_LAN_DGM@@
        Require ip @@IP_PORTAIL@@
    </Location>

    # --- Durcissement : templates_c (cache Smarty) inaccessible ------------
    <Directory /opt/postfixadmin/templates_c>
        Require all denied
    </Directory>

    TraceEnable off

    ErrorLog /var/log/apache2/postfixadmin-interne_error.log
    CustomLog /var/log/apache2/postfixadmin-interne_access.log combined
</VirtualHost>
