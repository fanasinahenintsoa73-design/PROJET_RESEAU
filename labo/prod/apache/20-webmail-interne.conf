# =============================================================================
# Webmail Roundcube - VHOST INTERNE (port 8080, HTTP brut)
# -----------------------------------------------------------------------------
# Ce vhost est le point d'entree du webmail EN PRODUCTION.
#
# ARCHITECTURE (Portail Meteo) :
#
#   Agent --HTTPS--> https://webmail.meteomadagascar.mg
#            (TLS termine par le nginx du Portail + Let's Encrypt)
#              |
#              |  proxy HTTP  +  en-tetes X-Forwarded-*
#              v
#        http://<ipCible>:8080   <-- CE vhost
#              |
#              v
#        Apache -> PHP-FPM (pool "roundcube") -> Roundcube
#              |
#              v
#        IMAP 127.0.0.1:993  /  SMTP 127.0.0.1:587   (direct, hors Portail)
#
# POURQUOI 8080 ET PAS 443 :
#   Le port 443 de 41.207.49.27 est deja tenu par le nginx du Portail
#   (il sert adl.meteomadagascar.mg). Deux processus ne peuvent pas ecouter
#   le meme port sur la meme IP. Le TLS est donc termine par le Portail et
#   notre Apache ne recoit QUE du HTTP sur 8080.
#
# CE QUE LE PORTAIL DOIT ENVOYER (nginx) :
#   proxy_set_header Host              $host;
#   proxy_set_header X-Forwarded-Host  $host;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-Port  $server_port;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#
# SEUL REGLE A BASCULER EN PRODUCTION :
#   dans le Portail, le champ "ipCible" du sous-domaine webmail :
#     - Portail sur le LAN de la DGM  -> ipCible = @@IP_MAIL_PRIVEE@@  (recommande)
#     - Portail hors LAN              -> ipCible = @@IP_MAIL_PUBLIQUE@@
#   Ce vhost, lui, ne change JAMAIS.
#
# REGLES RESEAU A NE PAS OUBLIER :
#   - le port 8080 ne doit PAS etre redirige (dst-nat) par le MikroTik si le
#     Portail est sur le LAN ;
#   - si le Portail est hors LAN, le port 8080 DOIT etre ouvert sur l'IP
#     publique du serveur mail, et le vhost doit alors restreindre
#     l'acces a l'IP du Portail (Require ip @@IP_PORTAIL@@).
# =============================================================================

Listen 8080

<VirtualHost *:8080>
    ServerName @@HOSTNAME_WEBMAIL@@
    DocumentRoot /var/www/roundcube/public_html

    # --- PHP-FPM : pool DEDIE (cloisonnement avec PostfixAdmin) -----------
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.1-fpm-roundcube.sock|fcgi://localhost"
    </FilesMatch>

    <Directory /var/www/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- Durcissement : config/temp/logs sont HORS docroot ------------------
    <DirectoryMatch "^/var/www/roundcube/(config|temp|logs)">
        Require all denied
    </DirectoryMatch>

    # --- Pas de TRACE (methode de trace HTTP) -------------------------------
    TraceEnable off

    ErrorLog /var/log/apache2/webmail-interne_error.log
    CustomLog /var/log/apache2/webmail-interne_access.log combined
</VirtualHost>
