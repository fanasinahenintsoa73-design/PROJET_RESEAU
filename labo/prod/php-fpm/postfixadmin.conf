; =============================================================================
; Pool PHP-FPM DEDIE a PostfixAdmin (ferme D8)
; -----------------------------------------------------------------------------
; PostfixAdmin est la console d'ADMINISTRATION : elle cree les comptes et
; change les mots de passe. C'est la cible la plus sensible de tout le projet
; (compromise = 500 adresses et tous les mots de passe).
;
; Il tourne donc sous son PROPRE utilisateur Unix (pfa), distinct de www-data,
; avec sa propre limite de memoire et son propre socket.
;
; PostfixAdmin n'est JAMAIS expose sur Internet : vhost interne 8081, restreint
; au reseau de la Direction Generale (cf. 21-postfixadmin-interne.conf).
; Usage : /etc/php/8.1/fpm/pool.d/postfixadmin.conf
; =============================================================================

[postfixadmin]
; Compte Unix dedie : NE DOIT PAS etre www-data (il l'est par defaut).
user = pfa
group = pfa

listen = /run/php/php8.1-fpm-postfixadmin.sock
; Apache tourne en www-data : il doit pouvoir ouvrir le socket, meme si le
; worker PHP s'execute sous pfa.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 6 workers suffisent : la console d'admin est utilisee par quelques personnes.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500

; --- Limites : l'admin n'envoie pas de gros fichiers -----------------------
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 4M
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 60

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php8.1-fpm-postfixadmin.log
