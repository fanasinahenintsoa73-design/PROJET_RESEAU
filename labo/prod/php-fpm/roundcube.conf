; =============================================================================
; Pool PHP-FPM DEDIE au webmail Roundcube (ferme D8)
; -----------------------------------------------------------------------------
; Pourquoi un pool separe du pool "www" :
;   PostfixAdmin et Roundcube ne doivent JAMAIS partager un meme interpreteur
;   PHP. Un pool = un utilisateur Unix + un socket + une limite de memoire.
;   Si le code de l'un est compromis, il ne peut pas utiliser les permissions
;   de l'autre. C'est la frontiere de securite du serveur web.
;
; Labo : identique a la prod (meme fichier deploye) pour que le cloisonnement
;        soit REELLEMENT teste et non seulement prevu.
; Usage : /etc/php/8.1/fpm/pool.d/roundcube.conf
; =============================================================================

[roundcube]
user = www-data
group = www-data

; Socket dedie : un par application.
listen = /run/php/php8.1-fpm-roundcube.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; "ondemand" : un worker n'est cree que s'il y a une requete.
; Sur la VM de labo (1,9 Gio de RAM) "dynamic" reserveait des workers pour
; rien ; en prod (32 Gio) ce choix reste valable et limite la consommation
; au strict necessaire.
pm = ondemand
pm.max_children = 40
pm.process_idle_timeout = 10s
pm.max_requests = 500

; --- Limites d'envoi ---------------------------------------------------------
; Le test navigateur du labo a montre une limite de 2,0 Mo (upload_max_filesize
; PHP par defaut). Les agents de la meteo envoient des images radar et des
; rapports : on aligne sur message_size_limit de Postfix (50 Mo).
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 52M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120

; --- Sessions : 30 minutes, coherent avec $config['session_lifetime'] = 30 ---
php_admin_value[session.gc_maxlifetime] = 1800

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_log] = /var/log/php8.1-fpm-roundcube.log
