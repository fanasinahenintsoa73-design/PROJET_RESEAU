# =============================================================================
# Rspamd - signature DKIM (LABO)
# Fichier : /etc/rspamd/local.d/dkim_signing.conf
#
# PIECE JUSTIFICATIVE DU NOMMAGE DES CLES
# ---------------------------------------
# Le modele de chemin est  "$domain.$selector.key"  : le DOMAINE vient en
# PREMIER. Pour le domaine meteo-test.lan et le selecteur "dkim", la clef
# doit donc s'appeler :
#     /var/lib/rspamd/dkim/meteo-test.lan.dkim.key
# et NON "dkim.meteo-test.lan.key".
#
# Un nom de fichier dans le desordre produit, dans le journal :
#     dkim_module_load_key_format: cannot parse raw private key
# et le message part SANS signature, silencieusement.
#
# La clef se genere ainsi (la cle est affichee sur stdout, PAS ecrite) :
#     sudo rspamadm dkim_keygen -d meteo-test.lan -s dkim -b 2048 \
#          -k /var/lib/rspamd/dkim/meteo-test.lan.dkim.key
# La sortie standard contient l'enregistrement DNS a publier.
#
# EN PROD : le domaine sera meteomadagascar.mg, le selecteur reste "dkim",
# et la clef s'appellera meteomadagascar.mg.dkim.key. Ce modele les suit
# automatiquement : rien a changer ici.
# =============================================================================

path = "/var/lib/rspamd/dkim/$domain.$selector.key";