# =============================================================================
# Rspamd - headers milter (LABO)
# Fichier : /etc/rspamd/local.d/milter_headers.conf
#
# Postfix parle a Rspamd en milter (TCP 127.0.0.1:11332, protocole 6).
# Cote Postfix (main.cf) :
#   smtpd_milters = inet:127.0.0.1:11332
#   non_smtpd_milters = $smtpd_milters
#   milter_protocol = 6
#   milter_mail_macros = i {mail_addr} {client_addr} {client_name} {auth_type} {auth_authen} {auth_author}
#   milter_default_action = accept
# =============================================================================

use = ["authentication-results", "x-spamd-result", "x-rspamd-server", "x-rspamd-queue-id"];

authenticated_headers = ["authentication-results"];

extended_spam_headers = true;

skip_local = false;

# skip_authenticated DOIT valoir false.
#
# Mesure : avec true, un message emis par un agent authentifie sur le 587
# sort SANS etre traite par Rspamd - ni score, ni signature DKIM, et un
# en-tete "Authentication-Results: ORIGINATING;" vide. Or le 587 est le
# SEUL canal d'envoi sortant de la conception : tous les envois des agents
# passent par lui. Avec true, aucun message de l'institution n'est signe.
#
# Cout : Rspamd analyse aussi les envois internes. C'est voulu - c'est ce
# qui empeche un poste infecte d'utiliser la messagerie comme relais.
skip_authenticated = false;
