# =============================================================================
# Rspamd - antivirus ClamAV sur les PIECES JOINTES
# Fichier : /etc/rspamd/local.d/antivirus.conf
# -----------------------------------------------------------------------------
# ATTENTION - PIECEGE STRUCTUREL (decouvert a l'execution, phase 14) :
# Ce fichier est un "local.d" : il est FUSIONNE DANS le bloc `antivirus { }`
#   defin par modules.d/antivirus.conf, via :
#       .include(try=true,priority=1,duplicate=merge)
#           "$LOCAL_CONFDIR/local.d/antivirus.conf"
#   Cet include est place A L'INTERIEUR du bloc `antivirus { }` (verifie sur
#   /etc/rspamd/modules.d/antivirus.conf).
#
#   => Ce fichier doit contenir UNIQUEMENT le bloc du SCANNER (`clamav { }`),
#      SANS l'enveloppe `antivirus { }`.
#
#   Si l'on redeclare `antivirus { }` ici, on obtient un bloc IMBRIQUE :
#       antivirus { antivirus { clamav { ... } } }
#   Rspamd signale alors :
#       "nested section: antivirus { antivirus { ... } },
#        it is likely a configuration error"
#       "unknown antivirus type: antivirus"
#   et le module antivirus ne scanne RIEN (silencieusement) : les pieces
#   jointes infectees passent.
#
# DECISION DE CONCEPTION (design n4) :
#   ClamAV analyse les PIECES JOINTES UNIQUEMENT, jamais le corps du message.
#   Un scan complet ferait chuter la delivrabilite pour un benefice faible.
#
# COMMENT CELA EST REALISE :
#   scan_mime_parts = true  -> Rspamd envoie a clamd les parties MIME
#                               separement, PAS le message entier.
#   scan_text_mime  = false -> les parties de type TEXTE ne sont pas analysees
#                               PAR LE SCANNER DE TEXTE (ce qui protege la
#                               delivrabilite des messages longs).
#
# ⚠️ RESULTAT MESURE (phase 14, test EICAR du 21 octobre 2026) :
#   Contrary a ce que la documentation du module laisse a croire, les
#   PIECES JOINTES de type texte SONT bien analysees : un EICAR place dans
#   une piece jointe `text/plain` est refuse (554 5.7.1). Seules les parties
#   texte du CORPS du message echappent au scan.
#   Les 4 cas du test de reference (labo/scripts/test-clamav-eicar.py) :
#     1. message sain, sans piece jointe ............ ACCEPTE
#     2. piece jointe BINAIRE EICAR (octet-stream) .. REFUSE  554 5.7.1
#     3. piece jointe TEXTE   EICAR (text/plain) .... REFUSE  554 5.7.1
#     4. EICAR place dans le CORPS, sans PJ ......... ACCEPTE  (conforme au
#                                                        design : le corps
#                                                        n'est jamais scanne)
#   => une piece jointe malveillante est bloquee quel que soit son type.
#      Seule limite reelle : la taille (max_size = 20 Mo) et le CPU.
#
# Coût : 1 seule ligne de configuration par scanner. Aucun code PHP, aucune
#        extension du core de Rspamd.
# =============================================================================

clamav {
  type = "clamav";

  # clamd en local, sur le socket TCP de clamd (TCPSocketAddr 127.0.0.1
  # dans clamd.conf : l'ecoute reste strictement locale).
  servers = "127.0.0.1:3310";

  # Refus IMMEDIAT du message si un virus est detecte : la barre 3
  # (Rspamd) de la conception s'appuie sur ce refus, pas sur le score.
  action = "reject";
  message = "Message refuse : virus detecte (${VIRUS})";

  # symbol ajoute aux metriques et aux en-tetes de diagnostic
  symbol = "CLAM_VIRUS";

  # analyse par parties MIME : le corps du message n'est pas transmis
  scan_mime_parts = true;

  # les parties texte ne sont pas analysees (voir la limitation ci-dessus)
  scan_text_mime = false;

  # au-dela de 20 Mo, la piece jointe n'est pas analysee (temps de scan)
  max_size = 20000000;
}
